<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaleoLab Científico – Laboratório Virtual de Paleontologia</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <!-- Vis.js Network CSS -->
    <link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.2/styles/vis-network.min.css">
    <!-- Estilos Globais Customizados -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Accessibility Skip Link -->
    <a href="#main-content" class="visually-hidden-focusable p-2 bg-dark text-white">Pular para o conteúdo principal</a>

    <!-- Accessibility Announcer -->
    <div id="aria-announcer" class="visually-hidden" aria-live="polite"></div>

    <!-- Header Principal -->
    <header class="header-paleo text-center py-3 shadow-sm">
        <div class="container-fluid">
            <h1 class="h3 mb-1 fw-bold">
                🦴 PaleoLab Científico 
                <span class="badge bg-warning text-dark fs-6 align-middle">v2.0.0</span>
            </h1>
            <p class="mb-0 text-light opacity-75 small">Laboratório Virtual de Paleontologia e Ciências Naturais</p>
        </div>
    </header>

    <!-- Navegação por Abas -->
    <nav class="nav-tabs-wrapper bg-dark py-2 shadow-sm" aria-label="Navegação por abas do laboratório">
        <div class="container-fluid">
            <div class="nav nav-tabs justify-content-center border-0 flex-wrap gap-1" id="nav-tab" role="tablist">
                <button class="tab-btn nav-link active" id="btn-tab-escala" data-tab="escala" role="tab" aria-controls="tab-escala" aria-selected="true">
                    <i class="bi bi-rulers me-1"></i> Escala Real
                </button>
                <button class="tab-btn nav-link" id="btn-tab-deriva" data-tab="deriva" role="tab" aria-controls="tab-deriva" aria-selected="false">
                    <i class="bi bi-globe2 me-1"></i> Deriva Continental
                </button>
                <button class="tab-btn nav-link" id="btn-tab-extincao" data-tab="extincao" role="tab" aria-controls="tab-extincao" aria-selected="false">
                    <i class="bi bi-biohazard me-1"></i> Extinção K‑Pg
                </button>
                <button class="tab-btn nav-link" id="btn-tab-icnofosseis" data-tab="icnofosseis" role="tab" aria-controls="tab-icnofosseis" aria-selected="false">
                    <i class="bi bi-footprints me-1"></i> Icnofósseis
                </button>
                <button class="tab-btn nav-link" id="btn-tab-fosseis" data-tab="fosseis" role="tab" aria-controls="tab-fosseis" aria-selected="false">
                    <i class="bi bi-journal-text me-1"></i> Fósseis Reais
                </button>
                <button class="tab-btn nav-link" id="btn-tab-massa" data-tab="massa" role="tab" aria-controls="tab-massa" aria-selected="false">
                    <i class="bi bi-weight-scale me-1"></i> Massa Corporal
                </button>
                <button class="tab-btn nav-link" id="btn-tab-quiz" data-tab="quiz" role="tab" aria-controls="tab-quiz" aria-selected="false">
                    <i class="bi bi-patch-question me-1"></i> Quiz & Batalha
                </button>
                <button class="tab-btn nav-link" id="btn-tab-tempo" data-tab="tempo" role="tab" aria-controls="tab-tempo" aria-selected="false">
                    <i class="bi bi-clock-history me-1"></i> Linha do Tempo
                </button>
                <button class="tab-btn nav-link" id="btn-tab-clima" data-tab="clima" role="tab" aria-controls="tab-clima" aria-selected="false">
                    <i class="bi bi-cloud-sun me-1"></i> Clima Mesozóico
                </button>
                <button class="tab-btn nav-link position-relative" id="btn-tab-conquistas" data-tab="conquistas" role="tab" aria-controls="tab-conquistas" aria-selected="false">
                    <i class="bi bi-trophy me-1"></i> Conquistas
                    <span id="badge-conquistas" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
                </button>
                <button class="tab-btn nav-link" id="btn-tab-pdf" data-tab="pdf" role="tab" aria-controls="tab-pdf" aria-selected="false">
                    <i class="bi bi-file-pdf me-1"></i> Exportar PDF
                </button>
                <button class="tab-btn nav-link" id="btn-tab-arvore" data-tab="arvore" role="tab" aria-controls="tab-arvore" aria-selected="false">
                    <i class="bi bi-diagram-3 me-1"></i> Árvore Evolutiva
                </button>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal das Abas -->
    <main id="main-content" class="container-fluid py-4">
        <div class="tab-content-container">
            <div class="tab-content active" id="tab-escala" role="tabpanel" aria-labelledby="btn-tab-escala"></div>
            <div class="tab-content" id="tab-deriva" role="tabpanel" aria-labelledby="btn-tab-deriva"></div>
            <div class="tab-content" id="tab-extincao" role="tabpanel" aria-labelledby="btn-tab-extincao"></div>
            <div class="tab-content" id="tab-icnofosseis" role="tabpanel" aria-labelledby="btn-tab-icnofosseis"></div>
            <div class="tab-content" id="tab-fosseis" role="tabpanel" aria-labelledby="btn-tab-fosseis"></div>
            <div class="tab-content" id="tab-massa" role="tabpanel" aria-labelledby="btn-tab-massa"></div>
            <div class="tab-content" id="tab-quiz" role="tabpanel" aria-labelledby="btn-tab-quiz"></div>
            <div class="tab-content" id="tab-tempo" role="tabpanel" aria-labelledby="btn-tab-tempo"></div>
            <div class="tab-content" id="tab-clima" role="tabpanel" aria-labelledby="btn-tab-clima"></div>
            <div class="tab-content" id="tab-conquistas" role="tabpanel" aria-labelledby="btn-tab-conquistas"></div>
            <div class="tab-content" id="tab-pdf" role="tabpanel" aria-labelledby="btn-tab-pdf"></div>
            <div class="tab-content" id="tab-arvore" role="tabpanel" aria-labelledby="btn-tab-arvore"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-3 bg-light text-muted border-top fs-7">
        <div class="container">
            <p class="mb-0">PaleoLab Científico v2.0.0 &copy; 2026 – Licença MIT. Desenvolvido para ensino e divulgação científica.</p>
        </div>
    </footer>

    <!-- Bibliotecas Externas (CDNs) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Módulos do PaleoLab -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
