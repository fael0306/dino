<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PaleoLab Científico – Laboratório Virtual de Paleontologia</title>
    <meta name="description" content="Laboratório virtual interativo de paleontologia: compare escalas, simule a extinção K-Pg, identifique pegadas fósseis e teste seus conhecimentos.">
    <meta name="theme-color" content="#1a2a3a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦴</text></svg>">

    <!-- Aplica o tema salvo antes da primeira pintura (evita "piscar") -->
    <script>
        try {
            var t = localStorage.getItem('paleolab_tema');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
            document.documentElement.setAttribute('data-tema', t);
        } catch (e) {}
        // Versão Android: o app abre index.html?plataforma=app (ou expõe a ponte nativa)
        if (/[?&]plataforma=app\b/.test(location.search) || window.PaleoLabNativo) {
            document.documentElement.setAttribute('data-plataforma', 'app');
        }
    </script>

    <!-- Ícones (as demais bibliotecas são carregadas sob demanda em js/loader.js) -->
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <a href="#paineis" class="pular-link">Pular para o conteúdo principal</a>
    <div id="aria-announcer" class="visualmente-oculto" aria-live="polite" aria-atomic="true"></div>

    <div class="app">
        <!-- Barra lateral -->
        <aside class="sidebar" id="sidebar" aria-label="Menu principal">
            <div class="sidebar-topo">
                <a href="#/inicio" class="logo" aria-label="PaleoLab Científico – início">
                    <span class="logo-icone" aria-hidden="true">🦴</span>
                    <span class="logo-texto"><strong>PaleoLab</strong><small>Científico</small></span>
                </a>
                <span class="versao">v2.0.1</span>
            </div>
            <nav class="nav-abas" id="nav-abas" role="tablist" aria-orientation="vertical" aria-label="Seções do laboratório"></nav>
            <div class="sidebar-rodape">
                <div class="progresso-lateral">
                    <div class="progresso-lateral-topo">
                        <span><i class="bi bi-trophy" aria-hidden="true"></i> Conquistas</span>
                        <strong data-progresso="texto">0/7</strong>
                    </div>
                    <div class="progresso" role="progressbar" aria-label="Conquistas desbloqueadas" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0">
                        <div class="progresso-barra" data-progresso="barra"></div>
                    </div>
                </div>
            </div>
        </aside>
        <div class="sobreposicao" id="sobreposicao" aria-hidden="true"></div>

        <!-- Área principal -->
        <div class="conteudo">
            <header class="topbar">
                <button type="button" class="btn-icone btn-menu" id="btn-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
                <a href="#/inicio" class="logo logo-topbar" aria-label="PaleoLab Científico – início">
                    <span class="logo-icone" aria-hidden="true">🦴</span><strong>PaleoLab</strong>
                </a>
                <div class="topbar-acoes">
                    <button type="button" class="btn-icone" id="btn-tema" aria-label="Ativar tema escuro" aria-pressed="false">
                        <i class="bi bi-moon-stars" aria-hidden="true"></i>
                    </button>
                </div>
            </header>

            <main id="paineis" class="paineis" tabindex="-1">
                <noscript>
                    <div class="alerta alerta-aviso">O PaleoLab precisa de JavaScript ativado para funcionar.</div>
                </noscript>
            </main>

            <footer class="rodape">
                <p>PaleoLab Científico v2.0.1 · Licença MIT · Feito para ensino e divulgação científica.</p>
                <p>Dados: Paleobiology Database, Campione &amp; Evans (2012), Scotese (2021), Ancient Earth.</p>
            </footer>
        </div>
    </div>

    <!-- Notificações -->
    <div id="toast-area" class="toast-area"></div>

    <!-- Ficha de dinossauro -->
    <dialog id="dialogo-ficha" class="dialogo dialogo-ficha" aria-labelledby="ficha-titulo">
        <button type="button" class="btn-icone dialogo-fechar" data-action="fechar-ficha" aria-label="Fechar ficha"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        <div class="dialogo-conteudo"></div>
    </dialog>

    <!-- Confirmação -->
    <dialog id="dialogo-confirmacao" class="dialogo dialogo-confirmacao" aria-labelledby="dialogo-conf-titulo" aria-describedby="dialogo-conf-msg">
        <form method="dialog">
            <h2 id="dialogo-conf-titulo" data-dialogo="titulo">Confirmar</h2>
            <p id="dialogo-conf-msg" data-dialogo="mensagem"></p>
            <div class="acoes acoes-direita">
                <button type="submit" value="cancelar" class="btn btn-secundario">Cancelar</button>
                <button type="submit" value="ok" class="btn btn-primario" data-dialogo="ok">Confirmar</button>
            </div>
        </form>
    </dialog>

    <!-- Módulos do PaleoLab (scripts clássicos: funcionam também abrindo o arquivo direto) -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/abas/inicio.js"></script>
    <script src="js/abas/escala.js"></script>
    <script src="js/abas/fosseis.js"></script>
    <script src="js/abas/deriva.js"></script>
    <script src="js/abas/tempo.js"></script>
    <script src="js/abas/clima.js"></script>
    <script src="js/abas/arvore.js"></script>
    <script src="js/abas/extincao.js"></script>
    <script src="js/abas/massa.js"></script>
    <script src="js/abas/icnofosseis.js"></script>
    <script src="js/abas/quiz.js"></script>
    <script src="js/abas/conquistas.js"></script>
    <script src="js/abas/pdf.js"></script>
    <script src="js/plataforma.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
